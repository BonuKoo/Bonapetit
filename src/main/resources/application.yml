# ============================================================
# 공통 설정 — 모든 프로필에서 동일하게 적용된다.
# 환경별 설정은 application-dev.yml / application-prod.yml 을 참조.
#
# 프로필 선택 우선순위(높은 쪽이 이김):
#   1) 실행 인자   --spring.profiles.active=prod
#   2) 환경변수    SPRING_PROFILES_ACTIVE=prod
#   3) 아래 기본값 dev
# 따라서 로컬은 아무 설정 없이 dev로 뜨고, 운영은 환경변수만 주면 된다.
# ============================================================
spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # 원본(다중 문서) 구조에서 기본 문서의 이 값이 prod 문서에도 그대로 적용되고 있었다.
        # 동작을 바꾸지 않기 위해 공통으로 올린다. dialect 는 환경마다 달라 각 프로필에서 지정.
        format_sql: true

  data:
    redis:
      port: 6379

  devtools:
    restart:
      enabled: false

  security:
    oauth2:
      client:
        # redirect-uri 는 환경마다 다르므로 각 프로필 파일에서 지정한다.
        registration:
          #카카오
          kakao:
            client-id: ${kakao.client.id}
            client-secret: ${kakao.client.secret}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code

          #네이버
          naver:
            client-id: ${naver.client.id}
            client-secret: ${naver.client.secret}
            client-name: Naver
            authorization-grant-type: authorization_code
            scope:
              - name

          # 구글
          google:
            client-id: ${google.client.id}
            client-secret: ${google.client.secret}
            client-name: Google
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          #네이버
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

# OPEN API 설정 - 키는 환경변수로 주입한다.
# fallback 없이 환경변수 필수. 과거 fallback 기본값은 실제 키였고 이미 git 이력에 노출됐다 —
# 각 콘솔에서 재발급 후 교체할 것 (2026-08-14, GitHub push protection이 Google 키를 감지해 fallback 제거).
kakao:
  client:
    id: ${KAKAO_CLIENT_ID}
    secret: ${KAKAO_CLIENT_SECRET}
naver:
  client:
    id: ${NAVER_CLIENT_ID}
    secret: ${NAVER_CLIENT_SECRET}
google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}

# 애플리케이션 설정
app:
  # 최초 소셜 로그인 시 관리자 권한을 부여할 oauth2_id 목록 (콤마 구분)
  admin-oauth2-ids: ${ADMIN_OAUTH2_IDS:}
