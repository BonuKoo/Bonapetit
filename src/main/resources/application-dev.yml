# ============================================================
# 개발(로컬) 프로필 — 기본으로 활성화된다.
# 공통 설정은 application.yml 참조.
# ============================================================
spring:
  datasource:
    # DBConfig 가 @ConfigurationProperties(prefix="spring.datasource") + DataSourceBuilder 로
    # HikariDataSource 를 만들기 때문에 키가 url 이 아니라 jdbc-url 이어야 한다.
    jdbc-url: jdbc:h2:tcp://localhost/~/eatmate
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}

  jwt:
    # 반드시 환경변수 JWT_SECRET으로 주입. 로컬 개발 기본값은 개발 전용이며 운영에 사용 금지.
    secret: ${JWT_SECRET:jIxcYARLKbjsUFEPksAcekGXpubvTVL+UxuNL68nqpE=}

  # NOTE: 아래 logging 은 spring 하위에 있어 실제로는 바인딩되지 않는다(무시됨).
  #       분리 작업에서는 동작을 바꾸지 않기 위해 원본 위치를 그대로 유지했다.
  #       실제로 적용하려면 최상위 logging: 으로 한 단계 올려야 한다.
  logging:
    level:
      root: DEBUG
      org.springframework: DEBUG
      org.hibernate: DEBUG
      org.springframework.security: DEBUG
      org.springframework.cache: trace
      org.springframework.cache.interceptor.CacheInterceptor: trace

  # STATIC 파일 자동 반영
  devtools:
    livereload:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
          naver:
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

# OAuth 키 - 로컬 개발 편의를 위한 더미 fallback.
#
# 공통(application.yml)은 fallback 없이 환경변수를 요구한다. 그대로 두면 로컬에서
# 앱을 띄울 때마다 환경변수 6개를 챙겨야 하고, IDE 실행 구성에 빠뜨리면
# "Could not resolve placeholder 'KAKAO_CLIENT_ID'"로 부팅이 실패한다.
#
# 여기 fallback은 dev 프로필에만 있으므로 운영은 영향받지 않는다. prod는 공통의
# ${KAKAO_CLIENT_ID}(fallback 없음)를 그대로 상속하므로 키를 빠뜨리면 여전히 부팅에 실패한다.
#
# 주의: 이 더미값으로는 소셜 로그인이 되지 않는다. 실제 로그인을 테스트하려면
# 해당 제공자 콘솔에서 키를 발급받아 환경변수로 주입할 것(하나만 발급해도 그 제공자로는 로그인된다).
# 과거 이 자리에 실제 키가 fallback으로 박혀 있다가 git 이력에 노출된 적이 있다.
# 절대 실제 키를 여기에 적지 말 것.
kakao:
  client:
    id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
    secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
naver:
  client:
    id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
    secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
google:
  client:
    id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
    secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}

# 파일 업로드 경로
file:
  dir:
    account: ${FILE_DIR:C:/TeamProject/eatmate/img}/profileimg
    team: ${FILE_DIR:C:/TeamProject/eatmate/img}/teamimg
    teamPost: ${FILE_DIR:C:/TeamProject/eatmate/img}/teampostimg

app:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,https://api.bonappetit.p-e.kr}
